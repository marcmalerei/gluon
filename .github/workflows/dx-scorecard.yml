name: DX Scorecard

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dx-scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  automated-evidence:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host --user pwuser
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run build
      - run: npm run benchmark:dx -- --output=.tmp/dx-scorecard/${{ github.sha }}.json
      - name: Retain raw automated evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dx-scorecard-${{ github.sha }}
          path: .tmp/dx-scorecard
          retention-days: 90
          if-no-files-found: error

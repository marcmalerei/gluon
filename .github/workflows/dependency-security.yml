name: Dependency Security

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
        timeout-minutes: 10
      - run: npm run check:dependency-security-policy
      - run: npm run check:dependency-security
      - name: Retain dependency audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-security-${{ github.sha }}
          path: .tmp/dependency-security
          retention-days: 30
          if-no-files-found: ignore
          include-hidden-files: true
